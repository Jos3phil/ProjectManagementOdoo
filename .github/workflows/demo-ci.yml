# ========================================================
# === WORKFLOW DE GITHUB ACTIONS - VERSIÓN DEFINITIVA ===
# ========================================================
name: 🚀 CI/CD Demo Pipeline - VICTORIA

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-demo-pipeline:
    name: 🧪 Run Automated Demo
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # 2. Levantar el entorno con el COMANDO MODERNO
      - name: 🐳 Build and start Docker services
        run: docker compose up -d

      # 3. Esperar a que la BD esté lista
      - name: ⏳ Wait for PostgreSQL to be ready
        run: sleep 30

      # 4. Ejecutar el script con la RUTA CORRECTA y el COMANDO MODERNO
      - name: 🚀 Execute the Demo Pipeline Script
        run: |
          # Damos permisos de ejecución al script en su nueva ubicación
          chmod +x addons/project_management/scripts/run_demo_pipeline.sh

          # Ejecutamos el script usando el comando moderno de docker compose
          docker compose exec -T web ./addons/project_management/scripts/run_demo_pipeline.sh
